<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1771447445">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f23">
  <title>Dasha - Étincelle</title>
  <link rel="stylesheet" href="../shared/base.css?v=1771447445">
  <link rel="stylesheet" href="portal.css?v=1771447445">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div id="app">
    <nav class="portal-nav">
      <a href="../index.html" class="btn-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        Famille
      </a>
    </nav>

    <header class="portal-header">
      <div class="portal-glow"></div>
      <h1 class="portal-title">Dasha</h1>
      <p class="portal-subtitle">Apprendre le français, devenir citoyenne</p>
      <div class="xp-bar-container" id="xp-bar-container">
        <div class="xp-bar-info">
          <span class="xp-level" id="xp-level">Niveau 1</span>
          <span class="xp-amount" id="xp-amount">0 XP</span>
        </div>
        <div class="xp-bar">
          <div class="xp-bar-fill" id="xp-bar-fill"></div>
        </div>
      </div>
      <div class="streak-badge" id="streak-badge">
        <span class="streak-fire">🔥</span>
        <span class="streak-count" id="streak-count">0</span>
        <span class="streak-label">jours</span>
      </div>
    </header>

    <div class="portal-grid">
      <a href="french/index.html" class="portal-card portal-card--french">
        <div class="portal-card-icon">🇫🇷</div>
        <div class="portal-card-info">
          <h2>Français B2+</h2>
          <p>Vocabulaire avancé, expressions, registres</p>
        </div>
        <div class="portal-card-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <a href="citizenship/index.html" class="portal-card portal-card--citizenship">
        <div class="portal-card-icon">🏛️</div>
        <div class="portal-card-info">
          <h2>Citoyenneté</h2>
          <p>Prépare le test de naturalisation</p>
        </div>
        <div class="portal-card-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

      <a href="stats/index.html" class="portal-card portal-card--stats">
        <div class="portal-card-icon">📊</div>
        <div class="portal-card-info">
          <h2>Statistiques</h2>
          <p>Suis ta progression et tes badges</p>
        </div>
        <div class="portal-card-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>
    </div>

    <div class="portal-badges" id="portal-badges"></div>
  </div>

  <!-- ═══ Mascot ═══ -->
  <div id="mascot">
    <div id="mascot-avatar"></div>
    <div id="mascot-bubble"></div>
  </div>

  <script type="module" src="portal.js?v=1771447445"></script>
  <script type="module" src="../shared/bug-report/bug-widget.js?v=1771447445"></script>
  <script>
  (function() {
    const MASCOTS = ['🥖', '🧀', '🥐', '🇫🇷'];
    const emoji = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];

    const avatarEl = document.getElementById('mascot-avatar');
    const bubbleEl = document.getElementById('mascot-bubble');
    avatarEl.textContent = emoji;

    let facts = [];
    let shownIndices = [];

    fetch('mascot/france-facts.json').then(r => r.json()).then(data => { facts = data; });

    function getRandomFact() {
      if (!facts.length) return 'Chargement…';
      if (shownIndices.length >= facts.length) shownIndices = [];
      let idx;
      do { idx = Math.floor(Math.random() * facts.length); } while (shownIndices.includes(idx));
      shownIndices.push(idx);
      return facts[idx];
    }

    function showFact() {
      bubbleEl.textContent = getRandomFact();
      bubbleEl.classList.add('visible');
      avatarEl.classList.add('talking');
      clearTimeout(bubbleEl._timer);
      bubbleEl._timer = setTimeout(() => {
        bubbleEl.classList.remove('visible');
        avatarEl.classList.remove('talking');
      }, 5000);
    }

    avatarEl.addEventListener('click', showFact);

    setTimeout(() => {
      bubbleEl.textContent = 'Clique sur moi pour un fun fact sur la France !';
      bubbleEl.classList.add('visible');
      bubbleEl._timer = setTimeout(() => bubbleEl.classList.remove('visible'), 4000);
    }, 1500);

    // Easter egg: tap the title 5 times rapidly
    (function() {
      const title = document.querySelector('.portal-title');
      const subtitle = document.querySelector('.portal-subtitle');
      const originalSubtitle = subtitle.textContent;
      let clicks = 0;
      let timer = null;

      title.style.cursor = 'pointer';
      title.addEventListener('click', function() {
        clicks++;
        clearTimeout(timer);
        timer = setTimeout(() => { clicks = 0; }, 800);

        if (clicks >= 5) {
          clicks = 0;
          // Brief Russian subtitle
          subtitle.textContent = 'Учить французский, стать гражданкой ❤️';
          subtitle.style.transition = 'opacity 0.3s';
          subtitle.style.opacity = '1';

          // Fire confetti (module is already initialized by portal.js)
          import('../shared/confetti.js').then(m => m.default.launch());

          // Mascot reacts
          avatarEl.textContent = '🪆';
          avatarEl.classList.add('talking');
          bubbleEl.textContent = 'Молодец, Даша! Tu es incroyable! 🇷🇺🇫🇷';
          bubbleEl.classList.add('visible');

          setTimeout(() => {
            subtitle.textContent = originalSubtitle;
            avatarEl.textContent = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];
            avatarEl.classList.remove('talking');
            bubbleEl.classList.remove('visible');
          }, 4000);
        }
      });
    })();
  })();
  </script>
</body>
</html>
