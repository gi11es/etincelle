# Include inside apprendre.dubuc.fr's server block. Only the oral workshop and
# pinned speech runtime need cross-origin isolation for threaded WebAssembly.
location ^~ /felix/healthy-lifestyle/ {
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control no-cache;
    try_files $uri $uri/ =404;
}
location ^~ /shared/vendor/moonshine-0.1.6/ {
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
}
